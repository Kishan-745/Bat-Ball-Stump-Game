<!DOCTYPE html>
<html lang="en">

<head>
     <title>Cricket Game</title>
     <link rel="stylesheet" href="cricket.css">
</head>

<body>
     <h1>Bat Ball Stump Game</h1>
     
     <button class="choice-button" onclick="
      let computerChoice= generateComputerChoice();
      let resultMsg = getResult('Bat', computerChoice);
      showResult('Bat',computerChoice,resultMsg);
      "><img src="images/bat.png" alt="Bat images" class="choice-image"></button>

     <button class="choice-button" onclick="
      computerChoice= generateComputerChoice();
      resultMsg=getResult('Ball',computerChoice);
      showResult('Ball',computerChoice,resultMsg);
      "><img src="images/ball.png" alt="Ball images" class="choice-image"></button>

     <button class="choice-button" onclick="
      computerChoice=generateComputerChoice();
      resultMsg=getResult('Stump',computerChoice);
      showResult('Stump',computerChoice,resultMsg);
      "><img src="images/stump.png" alt="Stump images" class="choice-image"></button>

      <button onclick="localStorage.clear()
     resetScore(); 
      ">Reset</button>

      <h3 id="user-move"></h3>
      <h3 id="computer-move"></h3>
      <h3 id="result"></h3>
      <h3 id="score"></h3>

     <script>
      let scoreStr= localStorage.getItem('Score');
      let score;
      resetScore(scoreStr);   

     function resetScore(scoreStr){
     if(scoreStr !==undefined){
          score=JSON.parse(scoreStr);
          }else{
              score= {
               win: 0,
               loss : 0,
               tie : 0,}
          }; 
          score.displayScore= function(){
                    return `won: ${score.win}, lossed: ${score.loss}, tied: ${score.tie}`;
                    
               } ;
               showResult();
     }

          
          //  score=JSON.parse(scoreStr) || {
          //      win: 0,
          //      loss : 0,
          //      tie : 0,}
     //      if(scoreStr){
     //           score=JSON.parse(scoreStr);
     //      }else{
     //          score= {
     //           win: 0,
     //           loss : 0,
     //           tie : 0,}
     //      }
     // // let score={
     //           win: 0,
     //           loss: 0,
     //           tie: 0,
               // displayScore: function(){
               //      return `won: ${score.win}, lossed: ${score.loss}, tied: ${score.tie}`;
               // }
          // }
         
          

          function generateComputerChoice() {
               let computerChoice;
               let randomNumber = Math.random() * 3;
               if (randomNumber <= 1) {
                    computerChoice = 'Bat';
               } else if (randomNumber <= 2) {
                    computerChoice = 'Ball';
               } else {
                    computerChoice = 'Stump';
               }
               return computerChoice;
          }

          function getResult(userMove, computerMove) {
               if (userMove === 'Bat') { 
                    if (computerMove === 'Ball') {
                         score.win++;
                    return 'User Won.';
                    } else if (computerMove === 'Bat') {
                         score.tie++;
                         return `it's a tie`;
                    } else {
                         score.loss++;
                         return 'Computer Won';
                    }

               } else if (userMove === 'Ball') {
                    if (computerMove === 'Ball') {
                         score.tie++;
                         return `it's a tie`;
                    } else if (computerMove === 'Bat') {
                         score.loss++;
                         return 'Computer Won';
                    } else {
                         score.win++;
                         return 'User Won';
                    }
               } else {
                    if (computerMove === 'Ball') {
                         score.loss++;
                         return 'Computer Won';
                    } else if (computerMove === 'Bat') {
                         score.win++;
                         return 'User Won';
                    } else {
                         score.tie++;
                         return `it's a tie`;
                    }
               }
          }

function showResult(userMove,computerMove,result){
     localStorage.setItem('Score',JSON.stringify(score));
              
     document.querySelector('#user-move').innerHTML=
     userMove!==undefined ?`You have Choose ${userMove}` : '';

     document.querySelector('#computer-move').innerHTML=
     computerMove!==undefined ? `Computer have Choose ${computerMove}` : '';

     document.querySelector('#result').innerHTML=
     result!==undefined?`result: ${result}` : '';

     document.querySelector('#score').innerHTML=`Your Score is: ${score.displayScore()}`;

          // alert(`You have Choose ${userMove}. Computer Choice is ${computerMove} 
          // result: ${result} 
               
          // ${score.displayScore()}` );        
                 }
     </script>
</body>

</html>
